[package]
name = "fizz"
version = "0.1.2"
edition = "2024"
license = "GPL-2.0-or-later"
keywords = ["wallet","evm","solana","tui","cli"]
description = "Wallet inspector cli for evm and solana"
repository = "https://github.com/canureal/fizz"
categories = ["command-line-utilities","cryptocurrency"]

[dependencies]
alloy = "2.4.1"
anyhow = "1.0.104"
async-trait = "0.1.92"
bs58 = "0.5.1"
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
comfy-table = "8.0.0"
reqwest = "0.13.4"
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
solana-client = "4.2.2"
solana-commitment-config = "3.1.1"
solana-pubkey = "4.2.1"
tokio = { version = "1.53.1", features = ["full"] }
